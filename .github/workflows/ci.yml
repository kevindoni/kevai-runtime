name: kevai-runtime-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek toolchain & jalankan tes
        run: |
          rustc --version
          cargo --version
          cargo test --all-targets
      - name: Build release
        run: cargo build --release
